<!DOCTYPE html>
<html>

<head>
    <title>Progression</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('my_static', filename='style.css') }}">
    <style>
        @font-face {
            font-family: "Libre Baskerville";
            src: url("{{ url_for('my_static', filename='LibreBaskerville-Regular.otf') }}");
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h3 id="title">Démarrage imminent...</h3>
    </div>
    <div id="encours" class="container mt-5">
        <div class="progress">
            <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
        </div>
        <div id="status" class="mt-3"><i class="bi bi-map"></i></div>
    </div>
    <div id="fini" class="container mt-5 collapse">
        <div id="archive" class="mt-3">
            Le résultat ici, l'archive à <a href="{{ url_for('download_archive', uuid=uuid) }}"><button type="button"
                    class="btn btn-success">Télécharger</button></a>
        </div>
        <div id="image" class="w-100 mt-2">
        </div>
</div>

    <div class="container py-5">
        <a href="{{ url_for('index') }}"><button type="button" class="btn btn-success">Accueil</button></a>
    </div>

<script>
    function checkProgress() {
        fetch("{{ url_for('progress_status') }}")
            .then(response => response.json())
            .then(data => {
                let encours = document.getElementById("encours");
                let fini = document.getElementById("fini");
                let bar = document.getElementById("progress-bar");
                let arch = document.getElementById("archive");
                let title = document.getElementById("title");
                let image = document.getElementById("image");

                if (data.status === "processing") {
                    document.getElementById("title").innerHTML = "Traitement en cours";
                    if (data.percent > 0) {
                        bar.style.width = data.percent + "%";
                        bar.innerText = data.percent + "%";
                    }
                    document.getElementById("status").innerHTML = data.message;
                    setTimeout(checkProgress, 2000);
                } else if (data.status === "done") {
                    title.innerHTML = "Traitement terminé !";
                    // arch.innerHTML = "Le résultat ici, l'archive à <a href='{{ url_for('download_archive', uuid=uuid) }}'><button type=\"button\" class=\"btn btn-success\">Télécharger</button></a>";
                    bar.classList.remove("progress-bar-animated");
                    // Afficher l'image du résultat
                    image.innerHTML = "<img src='{{ url_for('uploaded_image', filename='map.jpg') }}' class='w-25 img-fluid mt-3' alt='Résultat'>";
                    image.innerHTML += "<img src='{{ url_for('uploaded_image', filename='zoom.jpg') }}' class='w-25 img-fluid mt-3' alt=''>";

                    encours.classList.add("collapse");
                    fini.classList.remove("collapse");
                } else if (data.status === "error") {
                    title.innerHTML = "Traitement échoué";
                    document.getElementById("status").innerHTML = data.message;
                    bar.classList.remove("progress-bar-animated");
                } else {
                    setTimeout(checkProgress, 2000);
                }
            });
    }
    checkProgress();
</script>
</body>

</html>
